name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法 + 冒烟（无 ComfyUI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  e2e:
    name: 浏览器 e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: 确认有 Chrome
        run: google-chrome --version || chromium --version
      - run: npm run test:e2e
      - name: 失败时保留截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/.tmp/shots
          if-no-files-found: ignore
